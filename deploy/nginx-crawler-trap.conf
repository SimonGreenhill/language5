# ---------------------------------------------------------------------------
# Crawler-trap edge mitigation for transnewguinea.org (nginx)
# ---------------------------------------------------------------------------
# Companion to the app-level fix (robots.txt + sort/page validation).
# This protects the origin app server (upstream 127.0.0.1:3298) from the
# 25,945-IP fake-"Chrome/145.0.0.0" swarm that IGNORES robots.txt.
#
# ROLL OUT IN THIS ORDER, watching access logs between each step:
#   1. Add the http{}-level directives (zones + cache path).
#   2. Add the micro-cache to the list locations (safe, big win).
#   3. Add limit_req in *log-only* mode first (see note), watch for false
#      positives on real users, THEN enforce.
#
# All directives here are additive and reversible (comment out to roll back).
# Tune `rate=` / `burst=` against your real access log before enforcing.
# ---------------------------------------------------------------------------


# ===========================================================================
# http { ... }  BLOCK  (put these OUTSIDE any server{} — top-level http scope)
# ===========================================================================

# Per-IP rate-limit zone for the expensive list paths.
# 10m ~= 160k unique IPs tracked. rate=2r/s is a starting point — the fake
# swarm hammers far faster than a human browsing a list.
limit_req_zone $binary_remote_addr zone=lists:10m rate=2r/s;

# Micro-cache: absorbs repeated crawler hits to the same URL so they don't
# re-run the DB query. 60s validity is invisible to humans on mostly-static
# reference data.
proxy_cache_path /var/cache/nginx/tng levels=1:2 keys_zone=tngcache:10m
                 max_size=500m inactive=60m;

# Only cache when there is NO session/login cookie (anonymous GETs only), so
# logged-in editors always see live data.
map $http_cookie $tng_no_cache {
    default        0;
    ~sessionid     1;   # Django session cookie present -> bypass cache
}


# ===========================================================================
# server { ... }  BLOCK  for tng.simon.net.nz / transnewguinea.org
# ===========================================================================
#
# Apply to the list paths only. `location` uses a regex so it covers the
# index pages AND their detail pages, which also accept ?sort=/?page=:
#   /language/  /language/<slug>   /word/  /word/<slug>
#   /source/    /source/<slug>     /family/ ...   /cognacy/...
#
#   location ~ ^/(language|word|source|family|cognacy)(/|$) {
#
#       # --- rate limit ---------------------------------------------------
#       # nodelay lets a short human burst through; sustained floods are 503'd.
#       limit_req      zone=lists burst=5 nodelay;
#       limit_req_status 429;
#
#       # --- micro-cache --------------------------------------------------
#       proxy_cache            tngcache;
#       proxy_cache_valid      200 60s;
#       proxy_cache_key        "$scheme$host$request_uri";
#       proxy_cache_bypass     $tng_no_cache;   # don't serve cache to editors
#       proxy_no_cache         $tng_no_cache;   # don't store editor responses
#       add_header X-Cache-Status $upstream_cache_status always;
#
#       # --- existing upstream --------------------------------------------
#       proxy_pass             http://127.0.0.1:3298;
#       proxy_set_header       Host $host;
#       proxy_set_header       X-Real-IP $remote_addr;
#       proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
#       proxy_set_header       X-Forwarded-Proto $scheme;
#   }
#
# ---------------------------------------------------------------------------
# LOG-ONLY DRY RUN for the rate limit (do this FIRST):
#   Set the zone to a very high rate (e.g. rate=1000r/s) OR use
#   `limit_req ... ` on a cloned location that only logs, and watch:
#     grep ' 429 ' /var/log/nginx/access.log | awk '{print $1}' | sort -u
#   Confirm the 429s are the fake-UA swarm, not real users, before tightening.
#
# DO NOT hard-block the bare "Chrome/145.0.0.0" UA string — real users may
# share it. Prefer challenge (Cloudflare) + rate-limit here. If you must
# UA-block, match the FULL UA + behaviour and run `access_log`-only first.
# ---------------------------------------------------------------------------
