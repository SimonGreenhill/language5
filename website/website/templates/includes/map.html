{% load static %}

<div id="map" class="language-map rounded" style="width: 100%; height: 300px"></div>
{{ nearby|json_script:"map-nearby" }}

<link media="all" href="{% static "css/leaflet.css" %}" type="text/css" rel="stylesheet" />
<script src="{% static "js/jquery.js" %}" type="text/javascript"></script>
<script src="{% static "js/leaflet.js" %}" type="text/javascript"></script>

<script>
    $(document).ready(function() {
        var here = [{{ latitude }}, {{ longitude }}];
        var map = L.map('map', {minZoom: 4, maxZoom: 10, scrollWheelZoom: false, zoomSnap: 0.5})
            .setView(here, 5.5);
        map.attributionControl.setPrefix(false).addAttribution(
            'Language data &copy; <a href="https://transnewguinea.org">TransNewGuinea.org</a>, land &copy; <a href="https://www.naturalearthdata.com/">Natural Earth</a>'
        );

        // land: flat teal, as on the home page map
        fetch('{% static "data/land.geojson" %}').then(function (r) { return r.json(); }).then(function (land) {
            L.geoJSON(land, {
                interactive: false,
                style: {fillColor: '#1f6e7e', fillOpacity: 1, color: '#e9f1f2', weight: 0.6}
            }).addTo(map).bringToBack();
        });

        // other TNG languages
        JSON.parse(document.getElementById('map-nearby').textContent).forEach(function (l) {
            L.circleMarker([l.lat, l.lng], {
                radius: 3.5, weight: 0, fillColor: '#0b3d49', fillOpacity: 1
            }).bindTooltip(l.name, {direction: 'top', offset: [0, -4]})
              .on('click', function () { window.location = l.url; })
              .addTo(map);
        });

        // this language
        L.circleMarker(here, {
            radius: 8, color: '#ffffff', weight: 2.5, fillColor: '#b8a48f', fillOpacity: 1
        }).bindTooltip('{{ name|escapejs }}', {permanent: true, direction: 'right', offset: [10, 0], className: 'here-label'})
          .addTo(map);
    });
</script>
