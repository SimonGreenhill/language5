{% extends "base.html" %}
{% load static %}

{% block title %} {{ SITE_NAME }} Map {% endblock %}

{% block head %}
    <link media="all" href="{% static "css/leaflet.css" %}" type="text/css" rel="stylesheet" />
    <link media="all" href="{% static "css/leaflet.fullscreen.css" %}" type="text/css" rel="stylesheet" />
    <script src="{% static "js/jquery.js" %}" type="text/javascript"></script>
    <script src="{% static "js/leaflet.js" %}" type="text/javascript"></script>
    <script src="{% static "js/leaflet.fullscreen.js" %}" type="text/javascript"></script>
    <script src="{% static "js/leaflet.oms.js" %}" type="text/javascript"></script>
    
    <style type="text/css">
        .legend {
            padding: 6px 8px;
            background: white;
            background: rgba(255,255,255,0.8);
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            border-radius: 5px;
            line-height: 18px;
            color: #555;
        }
        .legend i {
            width: 18px;
            height: 18px;
            float: left;
            margin-right: 8px;
            opacity: 0.7;
        }
    </style>
{% endblock %}

{% block content %}
    <div class="pb-2 mb-4 border-bottom">
        <h1>{% block pageheader %}{% endblock %}</h1>
    </div>
    
    <div id="map" class="flat-map" style="width: 100%; height: 70vh; min-height: 400px"></div>

    <script>
        $(document).ready(function() {
            var map = L.map('map', {
                fullscreenControl: true,
                minZoom: 4,
                maxZoom: 12,
                fullscreenControlOptions: {
                  position: 'topleft'
              }
            }).setView([-5.3, 141.0], 5);
            var oms = new OverlappingMarkerSpiderfier(map);
            var p = L.divIcon({className: 'map-dot', iconSize: [8, 8]});
            // labels: on hover when crowded, permanent when zoomed in or few markers
            var labelled = [];
            function addMarker(lat, lng, text) {
                var m = L.marker([lat, lng], {icon: p}).addTo(map);
                m.labelText = text;
                labelled.push(m);
                oms.addMarker(m);
                return m;
            }
            function updateLabels() {
                var permanent = map.getZoom() >= 7 || labelled.length <= 50;
                labelled.forEach(function (m) {
                    m.unbindTooltip().bindTooltip(m.labelText, {permanent: permanent, direction: 'right', offset: [6, 0]});
                });
            }
            map.on('zoomend', updateLabels);
            function esc(text) {  // tooltips render HTML; labels are data
                var div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
            // flat teal land on white, as on the home page map
            map.attributionControl.setPrefix(false).addAttribution(
                'Language data &copy; <a href="https://transnewguinea.org">TransNewGuinea.org</a>, land &copy; <a href="https://www.naturalearthdata.com/">Natural Earth</a>'
            );
            fetch('{% static "data/land.geojson" %}').then(function (r) { return r.json(); }).then(function (land) {
                L.geoJSON(land, {
                    interactive: false,
                    style: {fillColor: '#1f6e7e', fillOpacity: 1, color: '#e9f1f2', weight: 0.6}
                }).addTo(map).bringToBack();
            });
            {% block records %}{% endblock %}
            updateLabels();
        });
    </script>
{% endblock %}
