{% extends "base.html" %}
{% load static %}

{% block title %} Do Cognacy: {% endblock %}


{% block head %}
  <link rel="stylesheet" type="text/css" href="{% static "css/select2.min.css" %}" />
  <script type="text/javascript" src="{% static "js/jquery.js" %}"></script>
  <script type="text/javascript" src="{% static "js/select2.min.js" %}"></script>
{% endblock %}


{% block content %}
    <div class="pb-2 mb-4 border-bottom">
        <h1>Do Cognacy:</h1>
    </div>
    
    <ul class="breadcrumb">
      <li class="breadcrumb-item">
          <a href="{% url "index" %}">Home</a>
      </li>
    </ul>
    
    <div class="p-3 mb-3 bg-body-tertiary border rounded">
        <h2>Do Cognacy</h2>
        
        <form action="{% url "cognacy:do_index" %}" method="post" class="">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" name="submit" class="btn btn-outline-secondary"><i class="bi bi-check-lg"></i> Go </button>
        </form>
    </div>
    
    <script>
        $(document).ready(function() {
          $('select').each(function(i) {
              $(this).select2({width:"element"});
          });
        });
    </script>
    
{% endblock %}
